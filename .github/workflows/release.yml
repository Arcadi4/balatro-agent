name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify release versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mod_version="$(jq -r .version mod/manifest.json)"
          mcp_version="$(jq -r .version mcp/package.json)"
          if [ "$tag" != "$mod_version" ] || [ "$tag" != "$mcp_version" ]; then
            echo "::error::Tag $tag, mod $mod_version, and MCP $mcp_version must match"
            exit 1
          fi

      - name: Validate Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit
          find mod -name '*.lua' -print0 | xargs -0 -n1 sh -c 'luajit -b "$1" /dev/null' _

      - name: Build native MCP packages
        working-directory: mcp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build:release

      - name: Archive native binaries
        working-directory: mcp/dist/npm
        run: |
          mkdir -p ../archives
          for binary_dir in */bin; do
            package="${binary_dir%/bin}"
            tar -czf "../archives/balatro-mcp-${package}-${GITHUB_REF_NAME}.tar.gz" -C "$package/bin" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-release
          path: mcp/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mcp-release
          path: mcp/dist
      # Node/npm are used only for registry OIDC staging, never for development or builds.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish native packages automatically
        working-directory: mcp/dist/npm
        run: |
          for binary_dir in */bin; do
            package="${binary_dir%/bin}"
            name="$(jq -r .name "$package/package.json")"
            version="$(jq -r .version "$package/package.json")"
            chmod +x "$binary_dir"/*
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              (cd "$package" && npm publish --ignore-scripts --provenance --access public)
            fi
          done

      - name: Stage launcher for one approval
        working-directory: mcp/dist/npm/balatro-mcp
        run: |
          chmod +x cli.cjs
          npm stage publish --ignore-scripts --provenance --access public

      - name: Package mod
        run: |
          cp -r mod balatro-agent
          rm -rf balatro-agent/tests
          zip -r "balatro-agent-${GITHUB_REF_NAME}.zip" balatro-agent

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "balatro-agent-${GITHUB_REF_NAME}.zip" mcp/dist/archives/*

      - name: Warn if Nexus Mods API key is missing
        if: ${{ env.NEXUSMODS_API_KEY == '' }}
        run: echo "::warning::NEXUSMODS_API_KEY secret is not set; skipping Nexus Mods upload."

      - name: Resolve Nexus Mods metadata
        if: ${{ env.NEXUSMODS_API_KEY != '' }}
        id: nexus_meta
        env:
          FILE_ID_INPUT: ${{ secrets.NEXUSMODS_FILE_ID || vars.NEXUSMODS_FILE_ID || '' }}
          MOD_ID_INPUT: ${{ secrets.NEXUSMODS_MOD_ID || vars.NEXUSMODS_MOD_ID || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

          MOD_ID="$MOD_ID_INPUT"
          if [ -z "$MOD_ID" ]; then
            mod_resp="$(curl -sS -H "apikey: $NEXUSMODS_API_KEY" -H "Accept: application/json" \
              "https://api.nexusmods.com/v3/games/balatro/mods/927" || true)"
            MOD_ID="$(echo "$mod_resp" | jq -r '.data.id // empty' 2>/dev/null || true)"
          fi
          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"

          FILE_ID="$FILE_ID_INPUT"
          if [ -z "$FILE_ID" ] && [ -n "$MOD_ID" ]; then
            files_resp="$(curl -sS -H "apikey: $NEXUSMODS_API_KEY" -H "Accept: application/json" \
              "https://api.nexusmods.com/v3/mods/$MOD_ID/files" || true)"
            FILE_ID="$(echo "$files_resp" | jq -r '
              .data.mod_files[]? |
              select(.is_active == true or (.versions[]?.category == "main")) |
              .id' 2>/dev/null | head -n 1 || true)"
            if [ -z "$FILE_ID" ]; then
              FILE_ID="$(echo "$files_resp" | jq -r '.data.mod_files[0]?.id // empty' 2>/dev/null || true)"
            fi
          fi

          if [ -z "$FILE_ID" ]; then
            echo "::error::Could not resolve Nexus Mods file_id. Set the NEXUSMODS_FILE_ID secret or repository variable (found under Files tab -> API Info on Nexus Mods)."
            exit 1
          fi
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"

          CHANGELOG=""
          if [ -n "$MOD_ID" ]; then
            BODY="$(gh release view "$GITHUB_REF_NAME" --json body -q .body 2>/dev/null || true)"
            if [ -n "$BODY" ]; then
              CHANGELOG="$(printf '%s\n' "$BODY" | sed -E \
                -e '/^[[:space:]]*#{1,6}[[:space:]]/d' \
                -e 's/\*\*//g' \
                -e 's/`//g' \
                -e 's/\[([^]]*)\]\(([^)]*)\)/\1 (\2)/g' | \
                sed -e '/./,$!d')"
            fi
          fi

          {
            echo "changelog<<__EOF__"
            printf '%s\n' "$CHANGELOG"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: ${{ env.NEXUSMODS_API_KEY != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.nexus_meta.outputs.file_id }}
          filename: balatro-agent-${{ github.ref_name }}.zip
          version: ${{ steps.nexus_meta.outputs.version }}
          display_name: Balatro Agent ${{ github.ref_name }}
          category: main
          archive_existing_version: false
          allow_mod_manager_download: true
          primary_mod_manager_download: true
          update_mod_version: true
          mod_id: ${{ steps.nexus_meta.outputs.mod_id }}
          changelog: ${{ steps.nexus_meta.outputs.changelog }}
