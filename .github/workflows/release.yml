name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify release versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mod_version="$(jq -r .version mod/manifest.json)"
          mcp_version="$(jq -r .version mcp/package.json)"
          if [ "$tag" != "$mod_version" ] || [ "$tag" != "$mcp_version" ]; then
            echo "::error::Tag $tag, mod $mod_version, and MCP $mcp_version must match"
            exit 1
          fi

      - name: Validate Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit
          find mod -name '*.lua' -exec luajit -b {} /dev/null \;

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install MCP dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Stage MCP package
        # OIDC trusted publishing: no NODE_AUTH_TOKEN, npm mints a short-lived token.
        # Human approves the staged version on npmjs (2FA) to complete the release.
        working-directory: mcp
        run: npm stage publish --provenance --access public

      - name: Package mod
        run: |
          cp -r mod balatro-agent
          rm -rf balatro-agent/tests
          zip -r "balatro-agent-${GITHUB_REF_NAME}.zip" balatro-agent

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "balatro-agent-${GITHUB_REF_NAME}.zip"
