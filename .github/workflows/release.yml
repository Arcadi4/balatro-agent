name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version mod/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v${tag} does not match mod/manifest.json version ${manifest}"
            exit 1
          fi

      - name: Validate Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit
          find mod -name '*.lua' -exec luajit -b {} /dev/null \;

      - name: Package mod
        run: |
          cp -r mod balatro-agent
          rm -rf balatro-agent/tests
          zip -r "balatro-agent-${GITHUB_REF_NAME}.zip" balatro-agent

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "balatro-agent-${GITHUB_REF_NAME}.zip"
